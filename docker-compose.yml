name: youtube-telegram-bot

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - backend

  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest@sha256:fd8fc7475af6a552dc74b4e587428c71565bfa3fde66ec612a77ea5e287f21ac
    restart: unless-stopped
    logging: *default-logging
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_LOCAL: "1"
      TELEGRAM_VERBOSITY: "1"
    expose:
      - "8081"
    volumes:
      - telegram-bot-api-data:/var/lib/telegram-bot-api
      - shared-temp:/shared-temp:ro
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8081"]
      interval: 10s
      timeout: 3s
      retries: 20
      start_period: 20s
    networks:
      - backend

  cobalt:
    image: ghcr.io/imputnet/cobalt:11.7.1-a636575@sha256:63186dd68afd57ce3bb1f62cc4c139f5fa95b9c3e87a3cf5c6e4c7a570523f62
    init: true
    read_only: true
    restart: unless-stopped
    logging: *default-logging
    environment:
      API_URL: "http://cobalt:9000/"
    expose:
      - "9000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:9000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  bot:
    image: youtube-telegram-bot:local
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
      telegram-bot-api:
        condition: service_healthy
    volumes:
      - shared-temp:/shared-temp
      - bot-logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import time; from pathlib import Path; p=Path('/tmp/bot-ready'); raise SystemExit(not p.exists() or time.time()-p.stat().st_mtime > 60)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    stop_grace_period: 45s
    networks:
      - backend

  log-viewer:
    image: youtube-telegram-bot:local
    restart: unless-stopped
    logging: *default-logging
    command: ["python", "-m", "app.log_viewer"]
    environment:
      LOG_DIR: /app/logs
      LOG_VIEWER_HOST: 0.0.0.0
      LOG_VIEWER_PORT: 8080
    ports:
      - "127.0.0.1:${LOG_VIEWER_PORT:-8088}:8080"
    volumes:
      - bot-logs:/app/logs:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2).read()"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  backend:
    driver: bridge
    internal: false

volumes:
  postgres-data:
  telegram-bot-api-data:
  shared-temp:
  bot-logs:
