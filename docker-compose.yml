name: youtube-telegram-bot

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - backend

  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest@sha256:fd8fc7475af6a552dc74b4e587428c71565bfa3fde66ec612a77ea5e287f21ac
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_LOCAL: "1"
      TELEGRAM_VERBOSITY: "1"
    expose:
      - "8081"
    volumes:
      - telegram-bot-api-data:/var/lib/telegram-bot-api
      - shared-temp:/shared-temp:ro
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8081"]
      interval: 10s
      timeout: 3s
      retries: 20
      start_period: 20s
    networks:
      - backend

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
      telegram-bot-api:
        condition: service_healthy
    volumes:
      - shared-temp:/shared-temp
    healthcheck:
      test: ["CMD", "python", "-c", "from pathlib import Path; raise SystemExit(not Path('/tmp/bot-ready').exists())"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    stop_grace_period: 45s
    networks:
      - backend

networks:
  backend:
    driver: bridge
    internal: false

volumes:
  postgres-data:
  telegram-bot-api-data:
  shared-temp:
