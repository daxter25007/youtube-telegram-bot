[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "youtube-telegram-bot"
version = "1.0.0"
description = "Telegram bot for downloading YouTube, TikTok, and Instagram media"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram==3.31.0",
    "aiohttp==3.14.3",
    "alembic==1.20.0",
    "asyncpg==0.31.0",
    "pydantic-settings==2.15.0",
    "sqlalchemy[asyncio]==2.0.54",
    "yt-dlp[default]==2026.8.19",
]

[project.optional-dependencies]
dev = [
    "aiosqlite==0.22.1",
    "pytest==8.4.2",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.9",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: requires external services and RUN_INTEGRATION_TESTS=1"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "SIM", "RUF"]
ignore = ["S101", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E501"]
"tests/*.py" = ["S105", "S106"]
